  - name: kategoriler
    label: Kategoriler
    icon: category
    editor:
      preview: false
    description: Tarif kategorileri. Sıralama sitedeki filtre düğmelerinin sırasıdır.
    files:
      - name: kategoriler
        label: Kategoriler
        file: src/data/kategoriler.json
        icon: category
        fields:
          - name: liste
            label: Kategoriler
            label_singular: Kategori
            widget: list
            collapsed: true
            summary: "{{tr}} · {{en}} · {{ar}}"
            fields:
              - name: anahtar
                label: Anahtar (Türkçe adres)
                widget: string
                hint: Türkçe adres ve tariflerdeki kategori kodu, ör. "corbalar". Küçük harf, Türkçe karaktersiz, tireli. Tarif bağlıyken DEĞİŞTİRME.
                pattern:
                  - ^[a-z0-9-]+$
                  - Yalnızca küçük harf (a-z), rakam ve tire kullan.
              - name: tr
                label: Türkçe adı
                widget: string
              - name: en
                label: İngilizce adı
                widget: string
              - name: ar
                label: Arapça adı
                widget: string
              - name: urlEn
                label: İngilizce/Arapça adres
                widget: string
                hint: ör. "soups". Latin harflerle.
                pattern:
                  - ^[a-z0-9-]+$
                  - Yalnızca küçük harf (a-z), rakam ve tire kullan.
