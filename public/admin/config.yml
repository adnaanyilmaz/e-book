# BU DOSYA OTOMATİK ÜRETİLİR: elle düzenleme.
# Kaynak: scripts/panel-ayarlari.mjs  ·  Yeniden üret: npm run panel
# Belgeler: https://sveltiacms.app/en/docs
backend:
  name: github
  repo: adnaanyilmaz/e-book
  branch: main
  auth_methods:
    - token
  commit_messages:
    create: 'Panel: "{{slug}}" eklendi ({{collection}})'
    update: 'Panel: "{{slug}}" güncellendi ({{collection}})'
    delete: 'Panel: "{{slug}}" silindi ({{collection}})'
    uploadMedia: "Panel: görsel yüklendi ({{path}})"
    deleteMedia: "Panel: görsel silindi ({{path}})"
app_title: Naif Mutfak · Yönetim
logo:
  src: /icon-192.png
site_url: https://naifmutfak.com
media_folder: /src/assets
public_folder: "@/assets"
slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: "-"
  lowercase: true
  trim: true
output:
  omit_empty_optional_fields: false
  json:
    indent_size: 2
i18n:
  structure: multiple_folders
  locales:
    - tr
    - en
    - ar
  default_locale: tr
  initial_locales: all
collections:
  - name: tarifler
    label: Tarifler
    label_singular: Tarif
    icon: restaurant_menu
    description: Türkçe kaynak dildir. Dil sekmeleriyle İngilizce ve Arapça çeviriyi aynı ekranda doldur. Kapak, tarih, kategori ve süreler tüm dillerde ortaktır; yalnızca Türkçede değiştirilir.
    folder: src/content/blog
    format: yaml-frontmatter
    extension: md
    create: true
    i18n: true
    identifier_field: baslik
    slug:
      template: "{{baslik}}"
      editable:
        - create
    media_folder: /src/assets/tarifler
    public_folder: "@/assets/tarifler"
    thumbnail: kapak
    summary: "{{baslik}}"
    sortable_fields:
      fields:
        - tarih
        - baslik
        - kategori
      default:
        field: tarih
        direction: descending
    view_groups:
      - label: Kategori
        field: kategori
    view_filters:
      - label: Taslaklar
        field: taslak
        pattern: true
    fields:
      - name: baslik
        label: Başlık
        widget: string
        maxlength: 80
        i18n: true
      - name: urlAdi
        label: Adres (URL) adı
        widget: string
        required: false
        i18n: true
        hint: İngilizce ve Arapça için önerilir (ör. red-lentil-soup). Boş bırakırsan dosya adı kullanılır. Yalnızca küçük harf, rakam ve tire.
        pattern:
          - ^[a-z0-9-]+$
          - Yalnızca küçük harf (a-z), rakam ve tire kullan.
      - name: aciklama
        label: Kısa açıklama
        widget: text
        maxlength: 170
        i18n: true
        hint: Google'da ve paylaşımlarda görünen tek cümlelik özet.
      - name: kapak
        label: Kapak fotoğrafı
        widget: image
        choose_url: false
        i18n: duplicate
        hint: Yatay, en az 1200 piksel genişlik.
      - name: kapakAlt
        label: Kapak fotoğrafının açıklaması
        widget: string
        i18n: true
        hint: Görme engelliler ve Google için fotoğrafta ne olduğunu anlat.
      - name: kategori
        label: Kategori
        widget: relation
        collection: kategoriler
        file: kategoriler
        i18n: duplicate
        value_field: "{{liste.*.anahtar}}"
        display_fields:
          - "{{liste.*.tr}}"
        search_fields:
          - "{{liste.*.tr}}"
        hint: Yeni kategori için soldaki "Kategoriler" bölümünü kullan.
      - name: hazirlamaSuresi
        label: Hazırlama süresi (dakika)
        widget: number
        value_type: int
        min: 1
        i18n: duplicate
      - name: pisirmeSuresi
        label: Pişirme süresi (dakika)
        widget: number
        value_type: int
        min: 0
        required: false
        i18n: duplicate
      - name: porsiyon
        label: Porsiyon
        widget: string
        required: false
        i18n: true
        hint: ör. 4 kişilik / Serves 4
      - name: malzemeler
        label: Malzemeler
        label_singular: Malzeme
        widget: list
        required: false
        i18n: true
        hint: Her satıra bir malzeme. Tarif metninde malzemeleri tekrar yazma; sayfada otomatik gösterilir.
      - name: body
        label: Tarif metni
        widget: richtext
        i18n: true
        hint: Kısa bir hikâye, ardından "Hazırlanışı" başlığı altında numaralı adımlar, isteğe bağlı "Püf noktası".
        buttons:
          - bold
          - italic
          - link
          - heading-two
          - heading-three
          - bulleted-list
          - numbered-list
          - quote
        editor_components: []
      - name: tarih
        label: Yayın tarihi
        widget: datetime
        type: date
        picker_utc: true
        i18n: duplicate
      - name: guncelleme
        label: Güncelleme tarihi
        widget: datetime
        type: date
        picker_utc: true
        required: false
        i18n: duplicate
        hint: Tarifi sonradan önemli ölçüde değiştirdiysen.
      - name: taslak
        label: Taslak (sitede gösterme)
        widget: boolean
        default: false
        i18n: duplicate
      - name: kapakKaynak
        label: Fotoğraf kaynağı
        widget: object
        required: false
        collapsed: true
        i18n: duplicate
        hint: Yalnızca başkasının (ör. Wikimedia, CC lisanslı) fotoğrafını kullanıyorsan doldur. Kendi fotoğrafın için boş bırak.
        fields:
          - name: yazar
            label: Fotoğrafçı
            widget: string
          - name: url
            label: Fotoğrafın kaynak sayfası
            widget: string
            pattern:
              - ^https://
              - https:// ile başlamalı.
          - name: lisans
            label: Lisans
            widget: string
            hint: ör. CC BY-SA 4.0
          - name: lisansUrl
            label: Lisans sayfası
            widget: string
            pattern:
              - ^https://
              - https:// ile başlamalı.
